[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worldmembench"
version = "0.1.0"
description = "WorldMemBench evaluation toolkit."
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["huggingface-hub>=1.5,<2"]

[project.optional-dependencies]
general-video-quality = [
    "numpy>=1.24,<2",
    "opencv-python-headless>=4.8,<5",
    "torch>=2.1",
    "torchvision>=0.16",
    "pyiqa==0.1.10",
    "openai-clip==1.0.1",
    "setuptools<82",
    "PyYAML>=6.0",
]
human = [
    "numpy>=1.24,<2",
    "opencv-python-headless>=4.8,<5",
    "opencv-python>=4.8,<4.12",
    "torch>=2.1",
    "torchvision>=0.16",
    "scipy>=1.10",
    "insightface==0.7.3",
    "onnxruntime-gpu>=1.21,<2",
    "transformers==5.14.1",
    "ultralytics==8.3.200",
    "openai-clip==1.0.1",
    "setuptools<82",
    "Pillow>=10",
    "PyYAML>=6.0",
]
object = [
    "numpy>=1.24,<2",
    "opencv-python-headless>=4.8,<5",
    "torch>=2.1",
    "torchvision>=0.16",
    "transformers==5.14.1",
    "openai-clip==1.0.1",
    "setuptools<82",
    "Pillow>=10",
    "PyYAML>=6.0",
]
environment = [
    "numpy>=1.24,<2",
    "opencv-python-headless>=4.8,<5",
    "torch>=2.1",
    "torchvision>=0.16",
    "transformers==5.14.1",
    "huggingface-hub>=1.5,<2",
    "scipy>=1.10",
    "Pillow>=10",
    "PyYAML>=6.0",
]
test = ["pytest>=8.0"]
camera = [
    "numpy>=1.24,<2",
    "opencv-python-headless>=4.8,<5",
    "PyYAML>=6.0",
    "huggingface-hub>=1.5,<2",
    "gdown>=5,<7",
]
dynamic = [
    "numpy>=1.24,<2",
    "opencv-python-headless>=4.8,<5",
    "PyYAML>=6.0",
    "huggingface-hub>=1.5,<2",
]

[project.scripts]
worldmembench = "worldmembench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
worldmembench = ["weight_checksums.json"]
